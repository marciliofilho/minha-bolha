name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-spike

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minha-bolha-android-debug
          if-no-files-found: error
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.minhabolha.android/.MainActivity
            sleep 8
            PID="$(adb shell pidof com.minhabolha.android | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "App process is not running"
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
            adb exec-out screencap -p > android-spike.png
            echo "Android spike process PID: $PID"

      - name: Upload Android smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: minha-bolha-android-smoke
          if-no-files-found: error
          path: android-spike.png
